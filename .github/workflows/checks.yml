name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-enhanced.txt
      - run: python -m pip install -r requirements-enhanced.txt
      - run: python -m compileall -q app tools
      - run: python -m unittest test_quota_summary_data test_spring_motion test_status_reactions.SchedulerTests test_ring_metrics test_work_actions test_sustained_reactions test_soft_curves_navigation test_release_version test_app_updates test_loop_cache test_decoder_runtime test_animation_quality test_sustained_player test_program_updates test_status_indicator test_read_completion test_reset_card test_reset_presentation test_reset_watch test_reset_recovery test_audit_fixes test_chat_config test_chat_config_ui test_chat_transport test_typography test_liquid_status test_release_retention test_local_workflow
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_PLATFORMTHEME: ''
      PYTHONPATH: .:tools:app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-linux.txt
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 bubblewrap
      - run: python -m pip install -r requirements-linux.txt
      - run: python -m compileall -q linux_app run_linux.py run_kde.py run_niri.py tools/build_linux.py tools/package_linux.py
      - name: Check Linux adapters and shared data handling
        run: python -m unittest test_linux_entrypoints test_linux_launcher test_linux_backends test_linux_kde test_linux_readonly test_linux_placement test_linux_surfaces test_linux_walk test_linux_niri test_reset_watch test_reset_recovery test_reset_presentation test_refresh_flow
